name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Verifica que el proyecto compile. Usa valores de relleno: no hace
      # falta un proyecto de Supabase real para comprobar que el build no
      # está roto en un PR.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      # Corta el PR si alguna dependencia tiene una vulnerabilidad conocida
      # de severidad alta o crítica.
      - run: npm audit --audit-level=high
